<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Silva Drip clothing, customer service and secure shopping."><title>Store dashboard — Silva Drip</title><link rel="stylesheet" href="store.css"></head><body><div data-header></div><main class="container"><span class="eyebrow">Store operations</span><h1>Silva control room.</h1><p id="adminNote" class="notice" role="status">Checking admin access…</p><div id="adminApp" hidden><div class="tabbar" role="tablist"><button data-tab="orders" aria-selected="true">Orders</button><button data-tab="products" aria-selected="false">Products & stock</button><button data-tab="settings" aria-selected="false">Delivery & policies</button></div><div id="adminContent"></div></div><dialog id="productDialog"><form id="productForm" class="stack"><h2>Edit product</h2><input name="id" type="hidden"><label>Name<input name="name" maxlength="120" required></label><label>Category<input name="cat" maxlength="60" required></label><label>Price in naira<input name="price" type="number" step="0.01" min="1" required></label><label>Description<textarea name="description" maxlength="5000"></textarea></label><label>Size guide<textarea name="size_guide" maxlength="4000" placeholder="Enter your actual garment measurements"></textarea></label><label>Main image path or HTTPS URL<input name="image" required></label><label>Additional photo URLs (one per line)<textarea name="gallery"></textarea></label><label>Upload a product photo<input type="file" id="photoUpload" accept="image/jpeg,image/png,image/webp"></label><p id="photoNote" role="status"></p><label><input name="active" type="checkbox" style="width:auto;display:inline;min-height:0"> Visible in shop</label><h3>Sizes, colours & stock</h3><p class="muted small">One variant per line: size | colour | stock. Use real stock counts.</p><textarea name="variants" rows="6" required></textarea><div class="actions"><button>Save product</button><button type="button" class="secondary" id="cancelProduct">Cancel</button></div><p id="productNote" role="status"></p></form></dialog></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="store.js"></script><script src="admin.js"></script></body></html>
