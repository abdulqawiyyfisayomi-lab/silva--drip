<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Silva Drip clothing, customer service and secure shopping."><title>Your bag & checkout — Silva Drip</title><link rel="stylesheet" href="store.css"><link rel="icon" type="image/png" href="silva-logo.png"><link rel="apple-touch-icon" href="silva-logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="site-polish.css"><script src="site-polish.js" defer></script></head><body><div data-header></div><main class="container"><span class="eyebrow">Your next favourite pieces</span><h1>Make it yours.</h1><div class="layout"><section class="stack"><div class="panel"><h2>Your bag</h2><div id="summary"></div><a href="index_2.html#shop">Continue shopping</a></div><form id="checkoutForm" class="panel stack"><h2>Delivery details</h2><div class="fields"><label>Full name<input name="name" autocomplete="name" maxlength="120" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label><label class="full">Street address<textarea name="address" autocomplete="street-address" maxlength="1000" required></textarea></label><label>City<input name="city" autocomplete="address-level2" maxlength="120" required></label><label>State / delivery zone<select name="zone" id="zone" required><option value="">Select delivery zone</option></select></label></div><label><input type="checkbox" required style="width:auto;min-height:0;display:inline"> I have read the <a href="policies.html" target="_blank" rel="noopener">delivery and returns information</a>.</label><button class="wide" id="payButton" disabled>Continue to secure payment →</button><p class="muted small">Payment details are entered securely on Paystack.</p></form></section><aside class="panel"><span class="eyebrow">Order summary</span><div id="totals"></div><p id="checkoutNote" class="notice" role="status">Loading your bag…</p><div id="verification"></div></aside></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="store.js"></script><script src="checkout.js"></script></body></html>
