<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Silva Drip</title>
<link rel="icon" href="silva logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<style>
  :root{
    --ink:#15161B; --bone:#EDE8DD; --bone-dim:#DCD6C7;
    --orange:#FF5A1F; --rust:#7A2E12; --steel:#6B7280;
    --line-dark: rgba(21,22,27,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bone); color:var(--ink); font-family:'Archivo',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Archivo Black',sans-serif; margin:0; letter-spacing:-0.01em;}
  a{color:inherit;}
  button, input{font-family:inherit;}
  button{cursor:pointer;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}

  /* NAV */
  .nav{position:sticky; top:0; z-index:40; background:var(--bone); border-bottom:1px solid var(--line-dark);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; height:72px; position:relative;}
  .logo{font-family:'Archivo Black'; font-size:1.25rem; letter-spacing:0.02em; text-decoration:none;}
  .logo span{color:var(--orange);}
  .nav-right{display:flex; align-items:center; gap:18px;}
  .nav-links{display:flex; gap:28px; list-style:none; margin:0; padding:0; align-items:center;}
  .nav-links a{text-decoration:none; font-size:0.92rem; font-weight:500; position:relative; padding-bottom:4px;}
  .nav-links a::after{content:''; position:absolute; left:0; bottom:0; width:0; height:2px; background:var(--orange); transition:width .2s ease;}
  .nav-links a:hover::after{width:100%;}
  .nav-links a.active{color:var(--orange);}
  .nav-links a.active::after{width:100%;}
  .cart-btn{display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--bone); border:none; padding:10px 16px; font-size:0.88rem; font-weight:600; text-decoration:none;}
  .mobile-bottom-nav{display:none;}
  @media(max-width:760px){
    body{padding-bottom:72px;}
    .nav-inner{height:72px; flex-wrap:nowrap; gap:8px;}
    .nav-right{width:auto; justify-content:flex-end; gap:10px;}
    .nav-links{display:none;}
    .mobile-bottom-nav{position:fixed; right:0; bottom:0; left:0; z-index:40; display:grid; grid-template-columns:repeat(4,1fr); background:var(--bone); border-top:1px solid var(--line-dark); box-shadow:0 -6px 18px rgba(21,22,27,0.08);}
    .mobile-bottom-nav a{display:flex; min-height:68px; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:var(--ink); text-decoration:none; font-size:0.7rem; font-weight:600;}
    .mobile-bottom-nav a i{color:var(--orange); font-size:1rem;}
    .mobile-bottom-nav a.active{color:var(--orange);}
  }

  /* PAGE HEAD */
  .page-head{background:var(--ink); color:var(--bone); padding:70px 0 44px; text-align:center;}
  .page-head .eyebrow{color:var(--orange); font-weight:600; font-size:0.85rem; margin-bottom:14px;}
  .page-head h1{font-size:clamp(2rem,6vw,3.2rem); text-transform:uppercase;}

  /* AUTH CARD */
  .auth-section{padding:56px 0 100px; display:flex; justify-content:center;}
  .auth-card{width:100%; max-width:420px; background:#fff; border:1px solid var(--line-dark); padding:34px 28px;}
  .auth-card p.lead{color:var(--steel); font-size:0.92rem; line-height:1.6; margin:0 0 24px;}
  .auth-form{display:flex; flex-direction:column; gap:16px;}
  .auth-form.hidden{display:none;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:0.8rem; font-weight:600; color:var(--steel);}
  .field input{border:1px solid var(--ink); background:#fff; padding:13px 14px; font-size:0.95rem; width:100%;}
  .field input:focus{outline:2px solid var(--orange); outline-offset:1px;}
  .field input.error{border-color:var(--rust); animation:shake .4s ease;}
  .err-msg{font-size:0.78rem; color:var(--rust); min-height:1em;}
  .submit-btn{background:var(--ink); color:var(--bone); border:none; padding:15px; font-weight:700; font-size:0.95rem; margin-top:4px; transition:transform .15s ease, background-color .15s ease, color .15s ease;}
  .submit-btn:hover{background:var(--orange); color:var(--ink);}
  .submit-btn:active{transform:scale(0.96);}
  .back-link{text-align:center; margin-top:20px; font-size:0.85rem;}
  .back-link a{text-decoration:underline; font-weight:600;}

  /* SUCCESS STATE */
  .success-view{display:none; text-align:center;}
  .success-view.show{display:block; animation:card-pop .45s cubic-bezier(.34,1.4,.64,1) both;}
  .check-icon{width:56px; height:56px; border-radius:50%; background:var(--orange); color:var(--ink); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-family:'Archivo Black'; font-size:1.5rem;}
  .success-view h2{font-size:1.3rem; margin-bottom:10px;}
  .success-view p{color:var(--steel); font-size:0.92rem; line-height:1.6; max-width:34ch; margin:0 auto 24px;}
  .resend-btn{background:none; border:1px solid var(--ink); padding:11px 20px; font-weight:700; font-size:0.85rem;}
  .resend-btn:hover{background:var(--ink); color:var(--bone);}

  footer{padding:40px 0 30px; background:var(--bone-dim);}
  .copyright{font-size:0.8rem; color:var(--steel); text-align:center;}

  /* ANIMATION */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }
  .page-head .eyebrow, .page-head h1{opacity:0; animation:head-in .7s ease forwards;}
  .page-head h1{animation-delay:.15s;}
  @keyframes head-in{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .auth-card{animation:card-in .5s ease forwards; opacity:0; animation-delay:.2s;}
  @keyframes card-in{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  @keyframes card-pop{ from{opacity:0; transform:scale(0.94);} to{opacity:1; transform:scale(1);} }
  @keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
  ::selection{background:var(--orange);color:var(--ink);}
  :focus-visible{outline:3px solid var(--orange);outline-offset:3px;}
  .announcement{background:var(--ink);color:var(--bone);text-align:center;padding:8px 16px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .nav{background:rgba(237,232,221,.92);backdrop-filter:blur(14px);}
  .logo{display:flex;align-items:center;gap:3px;}
  .logo-mark{width:28px;height:28px;object-fit:contain;margin-right:5px;}
  .page-head{position:relative;overflow:hidden;padding:72px 0 48px;text-align:left;}
  .page-head::after{content:'RESET';position:absolute;right:1%;bottom:-38px;color:rgba(237,232,221,.08);font-family:'Archivo Black';font-size:8rem;line-height:1;pointer-events:none;}
  .page-head .wrap{position:relative;z-index:1;}
  .page-head-logo{width:92px;height:92px;object-fit:contain;margin:0 0 22px;filter:drop-shadow(9px 10px 0 #FF5A1F);}
  .auth-section{position:relative;padding:72px 0 110px;}
  .auth-section::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(rgba(21,22,27,.11) 1px,transparent 1px);background-size:18px 18px;opacity:.2;pointer-events:none;}
  .auth-card{position:relative;z-index:1;}
  .submit-btn{display:flex;align-items:center;justify-content:center;gap:9px;}
  @media(max-width:760px){.announcement{font-size:.62rem;padding:7px 10px}.page-head{padding:54px 0 42px}.page-head::after{font-size:4.8rem;bottom:-4px}.page-head-logo{width:76px;height:76px}.auth-section{padding:54px 18px 86px}}
</style>
</head>
<body>
<div class="announcement">Free shipping over ₦150,000 · Drop 004 is live</div>

<nav class="nav">
  <div class="wrap nav-inner">

    <a href="index_2.html" class="logo"><img class="logo-mark" src="silva logo.png" alt="">SILVA<span>·</span>DRIP</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="index_2.html"><i class="fa-solid fa-shop" aria-hidden="true"></i>Shop</a></li>
        <li><a href="about_1.html"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>About</a></li>
        <li><a href="contact_1.html"><i class="fa-solid fa-envelope" aria-hidden="true"></i>Contact</a></li>
        <li><a href="login_2.html" class="active" aria-current="page"><i class="fa-solid fa-user" aria-hidden="true"></i>Account</a></li>
      </ul>
      <a href="index_2.html#shop" class="cart-btn">Shop</a>
    </div>
  </div>
</nav>

<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <a href="index_2.html"><i class="fa-solid fa-shop" aria-hidden="true"></i><span>Shop</span></a>
  <a href="about_1.html"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>About</span></a>
  <a href="contact_1.html"><i class="fa-solid fa-envelope" aria-hidden="true"></i><span>Contact</span></a>
  <a href="login_2.html" class="active" aria-current="page"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Account</span></a>
</nav>

<main class="wrap"><div class="page-head"><h1>Secure checkout</h1><p>Review your order and delivery details</p></div>
<section class="auth-section"><div class="auth-card" style="max-width:650px;width:100%">
<div id="summary"></div><form id="checkoutForm" class="auth-form">
<label>Full name<input name="name" autocomplete="name" maxlength="120" required></label>
<label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label>
<label>Delivery address<textarea name="address" autocomplete="street-address" maxlength="1000" required></textarea></label>
<label>City<input name="city" autocomplete="address-level2" maxlength="120" required></label>
<label>State<input name="state" autocomplete="address-level1" maxlength="120" required></label>
<p>Delivery within Nigeria. Shipping is included in the total shown.</p>
<button type="submit" class="submit-btn" id="payButton" disabled>Continue to Paystack</button></form>
<p id="checkoutNote" role="status">Loading your account…</p><a href="index_2.html#shop">Return to shop</a>
</div></section></main><script src="checkout.js"></script></body></html>
